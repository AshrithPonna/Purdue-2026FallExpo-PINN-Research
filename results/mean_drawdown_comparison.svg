<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title description">
  <title id="title">Mean Drawdown</title>
  <desc id="description">Mean maximum drawdown by controller across three synthetic stress scenarios. Values are percentages.</desc>
  <style>
    text { font-family: "Times New Roman", Georgia, serif; fill: #202020; }
    .axis { stroke: #303030; stroke-width: 1; }
    .guide { stroke: #dedede; stroke-width: 1; }
  </style>
  <rect width="880" height="550" fill="#ffffff"/>

  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700">Mean Drawdown</text>
  <text x="440" y="73" text-anchor="middle" font-size="12">Graph 2</text>

  <rect x="145" y="105" width="210" height="290" fill="#f7f7f5"/>
  <rect x="370" y="105" width="210" height="290" fill="#f7f7f5"/>
  <rect x="595" y="105" width="210" height="290" fill="#f7f7f5"/>

  <line x1="115" y1="105" x2="835" y2="105" class="guide"/>
