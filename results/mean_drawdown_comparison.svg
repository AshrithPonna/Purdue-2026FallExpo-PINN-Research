  <circle cx="463" cy="368.5" r="5.5" fill="#a14c35"/>
  <text x="463" y="387" text-anchor="middle" font-size="11.5">0.73%</text>
  <circle cx="487" cy="351.7" r="5.5" fill="#536b3b"/>
