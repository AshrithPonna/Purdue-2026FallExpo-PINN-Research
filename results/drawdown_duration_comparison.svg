<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title description">
  <title id="title">Drawdown Duration</title>
  <desc id="description">Mean maximum drawdown duration by controller across three synthetic stress scenarios. Values are steps.</desc>
  <style>
    text { font-family: "Times New Roman", Georgia, serif; fill: #202020; }
    .axis { stroke: #303030; stroke-width: 1; }
    .guide { stroke: #dedede; stroke-width: 1; }
  </style>
  <rect width="880" height="550" fill="#ffffff"/>

  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700">Drawdown Duration</text>
  <text x="440" y="73" text-anchor="middle" font-size="12">Graph 4</text>

  <line x1="115" y1="105" x2="835" y2="105" class="guide"/>
  <line x1="115" y1="177.5" x2="835" y2="177.5" class="guide"/>
  <line x1="115" y1="250" x2="835" y2="250" class="guide"/>
  <line x1="115" y1="322.5" x2="835" y2="322.5" class="guide"/>
  <line x1="115" y1="395" x2="835" y2="395" class="axis"/>
  <line x1="115" y1="105" x2="115" y2="395" class="axis"/>

  <text x="102" y="399" text-anchor="end" font-size="12">0</text>
  <text x="102" y="327" text-anchor="end" font-size="12">40</text>
  <text x="102" y="254" text-anchor="end" font-size="12">80</text>
  <text x="102" y="181" text-anchor="end" font-size="12">120</text>
  <text x="102" y="109" text-anchor="end" font-size="12">160</text>
  <text x="42" y="250" text-anchor="middle" font-size="14" transform="rotate(-90 42 250)">Mean drawdown duration (steps)</text>

  <circle cx="190" cy="359.1" r="5.5" fill="#1f4e79"/>
  <text x="190" y="346" text-anchor="middle" font-size="11.5">19.8</text>
  <circle cx="230" cy="336.3" r="5.5" fill="#a14c35"/>
  <text x="230" y="354" text-anchor="middle" font-size="11.5">32.4</text>
  <circle cx="270" cy="313.8" r="5.5" fill="#536b3b"/>
  <text x="270" y="301" text-anchor="middle" font-size="11.5">44.8</text>
  <circle cx="310" cy="312.9" r="5.5" fill="#75567a"/>
  <text x="310" y="330" text-anchor="middle" font-size="11.5">45.3</text>

  <circle cx="415" cy="358.6" r="5.5" fill="#1f4e79"/>
  <text x="415" y="346" text-anchor="middle" font-size="11.5">20.1</text>
  <circle cx="455" cy="337.4" r="5.5" fill="#a14c35"/>
  <text x="455" y="355" text-anchor="middle" font-size="11.5">31.8</text>
  <circle cx="495" cy="303.7" r="5.5" fill="#536b3b"/>
  <text x="495" y="291" text-anchor="middle" font-size="11.5">50.4</text>
  <circle cx="535" cy="304.6" r="5.5" fill="#75567a"/>
  <text x="535" y="322" text-anchor="middle" font-size="11.5">49.9</text>

  <circle cx="640" cy="245.9" r="5.5" fill="#1f4e79"/>
  <text x="640" y="233" text-anchor="middle" font-size="11.5">82.3</text>
  <circle cx="680" cy="164.1" r="5.5" fill="#a14c35"/>
  <text x="680" y="151" text-anchor="middle" font-size="11.5">127.4</text>
  <circle cx="720" cy="135.5" r="5.5" fill="#536b3b"/>
  <text x="720" y="123" text-anchor="middle" font-size="11.5">143.2</text>
  <circle cx="760" cy="136.2" r="5.5" fill="#75567a"/>
  <text x="760" y="154" text-anchor="middle" font-size="11.5">142.8</text>

  <text x="250" y="430" text-anchor="middle" font-size="13">Volatility shift</text>
  <text x="475" y="430" text-anchor="middle" font-size="13">Heavy-tail</text>
  <text x="700" y="430" text-anchor="middle" font-size="13">Cointegration break</text>
  <text x="475" y="466" text-anchor="middle" font-size="14">Stress scenario</text>

  <rect x="128" y="114" width="242" height="104" fill="#ffffff" stroke="#404040" stroke-width="1"/>
  <circle cx="142" cy="133" r="5" fill="#1f4e79"/>
  <text x="154" y="137" font-size="11.5">Threshold, no AKF de-risking</text>
  <circle cx="142" cy="156" r="5" fill="#a14c35"/>
