<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title description">
  <title id="title">95th-Percentile Drawdown</title>
  <desc id="description">95th-percentile maximum drawdown by controller across three synthetic stress scenarios. Values are percentages.</desc>
  <style>
    text { font-family: "Times New Roman", Georgia, serif; fill: #202020; }
    .axis { stroke: #303030; stroke-width: 1; }
    .guide { stroke: #dedede; stroke-width: 1; }
  </style>
  <rect width="880" height="550" fill="#ffffff"/>

  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700">95th-Percentile Drawdown</text>
  <text x="440" y="73" text-anchor="middle" font-size="12">Graph 3</text>

  <line x1="115" y1="105" x2="835" y2="105" class="guide"/>
  <line x1="115" y1="177.5" x2="835" y2="177.5" class="guide"/>
  <line x1="115" y1="250" x2="835" y2="250" class="guide"/>
  <line x1="115" y1="322.5" x2="835" y2="322.5" class="guide"/>
  <line x1="115" y1="395" x2="835" y2="395" class="axis"/>
  <line x1="115" y1="105" x2="115" y2="395" class="axis"/>

  <text x="102" y="399" text-anchor="end" font-size="12">0%</text>
  <text x="102" y="327" text-anchor="end" font-size="12">5%</text>
  <text x="102" y="254" text-anchor="end" font-size="12">10%</text>
  <text x="102" y="181" text-anchor="end" font-size="12">15%</text>
  <text x="102" y="109" text-anchor="end" font-size="12">20%</text>
  <text x="42" y="250" text-anchor="middle" font-size="14" transform="rotate(-90 42 250)">95th-percentile drawdown (%)</text>

  <circle cx="190" cy="359.9" r="5.5" fill="#1f4e79"/>
  <text x="190" y="346" text-anchor="middle" font-size="11.5">2.42%</text>
  <circle cx="230" cy="378.5" r="5.5" fill="#a14c35"/>
  <text x="230" y="365" text-anchor="middle" font-size="11.5">1.14%</text>
  <circle cx="270" cy="372.7" r="5.5" fill="#536b3b"/>
  <text x="270" y="359" text-anchor="middle" font-size="11.5">1.54%</text>
  <circle cx="310" cy="372.4" r="5.5" fill="#75567a"/>
  <text x="310" y="359" text-anchor="middle" font-size="11.5">1.56%</text>

  <circle cx="415" cy="349.3" r="5.5" fill="#1f4e79"/>
  <text x="415" y="336" text-anchor="middle" font-size="11.5">3.15%</text>
  <circle cx="455" cy="373.8" r="5.5" fill="#a14c35"/>
  <text x="455" y="360" text-anchor="middle" font-size="11.5">1.46%</text>
  <circle cx="495" cy="361.8" r="5.5" fill="#536b3b"/>
  <text x="495" y="348" text-anchor="middle" font-size="11.5">2.29%</text>
  <circle cx="535" cy="362.1" r="5.5" fill="#75567a"/>
  <text x="535" y="348" text-anchor="middle" font-size="11.5">2.27%</text>

  <circle cx="640" cy="110.0" r="5.5" fill="#1f4e79"/>
  <text x="640" y="97" text-anchor="middle" font-size="11.5">19.66%</text>
  <circle cx="680" cy="329.8" r="5.5" fill="#a14c35"/>
  <text x="680" y="316" text-anchor="middle" font-size="11.5">4.49%</text>
  <circle cx="720" cy="260.0" r="5.5" fill="#536b3b"/>
  <text x="720" y="247" text-anchor="middle" font-size="11.5">9.32%</text>
  <circle cx="760" cy="263.6" r="5.5" fill="#75567a"/>
  <text x="760" y="250" text-anchor="middle" font-size="11.5">9.06%</text>

  <text x="250" y="430" text-anchor="middle" font-size="13">Volatility shift</text>
  <text x="475" y="430" text-anchor="middle" font-size="13">Heavy-tail</text>
  <text x="700" y="430" text-anchor="middle" font-size="13">Cointegration break</text>
  <text x="475" y="466" text-anchor="middle" font-size="14">Stress scenario</text>

  <rect x="128" y="114" width="242" height="104" fill="#ffffff" stroke="#404040" stroke-width="1"/>
  <circle cx="142" cy="133" r="5" fill="#1f4e79"/>
  <text x="154" y="137" font-size="11.5">Threshold, no AKF de-risking</text>
  <circle cx="142" cy="156" r="5" fill="#a14c35"/>
  <text x="154" y="160" font-size="11.5">Threshold + AKF de-risking</text>
  <circle cx="142" cy="179" r="5" fill="#536b3b"/>
  <text x="154" y="183" font-size="11.5">HJB-PINN, no fee term + AKF</text>
  <circle cx="142" cy="202" r="5" fill="#75567a"/>
  <text x="154" y="206" font-size="11.5">HJB-PINN, fee-aware + AKF</text>
