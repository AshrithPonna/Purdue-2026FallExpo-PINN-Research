  <text x="102" y="150" text-anchor="end" font-size="12">$20k</text>
  <text x="102" y="109" text-anchor="end" font-size="12">$25k</text>
  <text x="42" y="250" text-anchor="middle" font-size="14" transform="rotate(-90 42 250)">Lower-tail 5% mean P&amp;L ($)</text>

  <circle cx="190" cy="134.7" r="5.5" fill="#1f4e79"/>
