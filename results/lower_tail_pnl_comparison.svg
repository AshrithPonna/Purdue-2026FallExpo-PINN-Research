<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title description">
  <title id="title">Lower-tail 5% P&amp;L</title>
  <desc id="description">Mean P&amp;L in the lowest five percent of outcomes by controller across three synthetic stress scenarios. Values are dollars.</desc>
  <style>
    text { font-family: "Times New Roman", Georgia, serif; fill: #202020; }
    .axis { stroke: #303030; stroke-width: 1; }
    .guide { stroke: #dedede; stroke-width: 1; }
    .zero { stroke: #777777; stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <rect width="880" height="550" fill="#ffffff"/>

  <text x="440" y="50" text-anchor="middle" font-size="22" font-weight="700">Lower-tail 5% P&amp;L</text>
  <text x="440" y="73" text-anchor="middle" font-size="12">Graph 6</text>

  <rect x="145" y="105" width="210" height="290" fill="#f7f7f5"/>
  <rect x="370" y="105" width="210" height="290" fill="#f7f7f5"/>
  <rect x="595" y="105" width="210" height="290" fill="#f7f7f5"/>

  <line x1="115" y1="105" x2="835" y2="105" class="guide"/>
  <line x1="115" y1="146.4" x2="835" y2="146.4" class="guide"/>
  <line x1="115" y1="229.3" x2="835" y2="229.3" class="guide"/>
  <line x1="115" y1="312.1" x2="835" y2="312.1" class="zero"/>
  <line x1="115" y1="395" x2="835" y2="395" class="axis"/>
  <line x1="115" y1="105" x2="115" y2="395" class="axis"/>

