  <circle cx="415" cy="126.4" r="5.5" fill="#1f4e79"/>
  <text x="415" y="113" text-anchor="middle" font-size="11.5">$22.3k</text>
  <circle cx="455" cy="188.6" r="5.5" fill="#a14c35"/>
